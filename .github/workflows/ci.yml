name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Real keys come from repository secrets. Pull requests from forks get no
      # secrets, so the build falls back to a syntactically valid placeholder key:
      # building needs only the key's format, not a live Clerk instance.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Type-check
        run: pnpm typecheck

      - name: Check migrations match the schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain server/db/migrations)" ]; then
            echo "::error::server/db/schema.ts changed without a migration. Run 'pnpm db:generate' and commit the result."
            git status --porcelain server/db/migrations
            exit 1
          fi

      - name: Unit, property and server tests (with coverage)
        run: pnpm test:coverage

      - name: Build (fails if /field is not static)
        run: pnpm build

  e2e:
    name: End-to-end (Chromium, WebKit)
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    # Needs real Clerk keys and test users, which forks do not get.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_INSPECTOR_EMAIL: ${{ secrets.E2E_INSPECTOR_EMAIL }}
      E2E_SUPERVISOR_EMAIL: ${{ secrets.E2E_SUPERVISOR_EMAIL }}
    steps:
      - name: Require test secrets
        run: |
          missing=0
          for name in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY E2E_INSPECTOR_EMAIL E2E_SUPERVISOR_EMAIL; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set (see README, 'Continuous integration')."; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Build
        run: pnpm build
      - name: Playwright
        run: pnpm test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
